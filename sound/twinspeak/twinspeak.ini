; twinspeak v6.5.12 MOVIE PASS -- built from your uploaded ini (v6.5.12 exe).
; Four deltas, everything else byte-identical to what you sent:
;
;   1. drift_interval_ms = 2000 is now HONORED. In v6.5.11 and earlier the
;      clamp floor was 5000, so your 2000 silently ran at 5000 -- you were
;      never getting the 2 s resync you asked for. The warden's ledger is
;      frame arithmetic (not the noisy ppm meter), so 2 s spacing costs
;      nothing in accuracy: worst case to the first re-pin drops from
;      ~15 s (3 streak windows x 5 s) to ~6 s.
;   2. drift_correct_ms 4 -> 2: with a 2 s interval the error only has
;      ~2 ms of room to grow between evaluations, so each re-pin is a
;      smaller, less audible skip. Tighter chasing, gentler corrections.
;   3. keepalive_gain 0.001 -> 0.03: your old value was BELOW the
;      documented S5 detect threshold (your own template comment warned
;      about this). During a movie's quiet passages the amp's DSP can
;      power down and re-prime its FIFO deeper on the next loud scene --
;      one more way a movie accumulates center lag no host meter can see.
;   4. deep_resync_min = 30 (NEW, v6.5.12): every 30 minutes the center
;      leg is reopened fresh, which re-primes the S5's below-packetizer
;      FIFO -- the layer that can deepen silently over a long session
;      while the drift ledger stays pinned (that is the drift no host
;      meter can see; a fresh reopen is the one reset for it). Each
;      resync is a brief center gap; the warden re-arms ~9 s later and
;      your delay1_ms calibration carries across untouched. Set it to 0
;      if the scheduled gap ever bothers you.

; ---- out periods (WASAPI fallback only; KS ignores these) ------------------
out1ms = 2
out2ms = 2

; ---- capture burst ----------------------------------------------------------
cap_ms = 2

; capture pin: exclusive direct WaveRT path
capture_exclusive = on

; ---- ring depth -------------------------------------------------------------
ring1_ms = 2
ring2_ms = 2

; ---- alignment (your calibrated value, untouched) ---------------------------
delay1_ms = 64
delay2_ms = 0

; ---- share mode -------------------------------------------------------------
exclusive = on
align_modes = on

; ---- routing ----------------------------------------------------------------
lfe_fold = on

; ---- devices ----------------------------------------------------------------
input_device   = Line 1
output_device1 = Realtek
output_device2 = Adesso

; ---- mixes ------------------------------------------------------------------
gain_l = 1.0
gain_r = 1.0
gain_lfe = 0.809
gain_center = 1.0

; ---- volume -----------------------------------------------------------------
volume_follow = on
volume_endpoint =
pin_outputs = on
out2_first = on

; ---- keep-alive -------------------------------------------------------------
; RAISED 0.001 -> 0.03: 0.001 is below the documented S5 detect threshold;
; quiet movie passages can let the amp's DSP power down and re-prime its
; FIFO deeper on the next loud scene. 0.03 is still inaudible.
keepalive_hz = 100
keepalive_gain = 0.03

; ---- chimes -----------------------------------------------------------------
chimes = on
chime_gain = 0.3

; ---- background -------------------------------------------------------------
background = on

; ---- WDM-KS TRANSPORT -------------------------------------------------------
backend1 = ks
backend2 = ks
ks_period_frames = 128
ks_periods = 3

; ---- clock sync -------------------------------------------------------------
clock_sync = on

; ---- drift warden -----------------------------------------------------------
; drift_interval_ms = 2000 is now honored (v6.5.12 clamp floor 2000; it
; used to clamp silently to 5000). drift_correct_ms 4 -> 2: smaller skips,
; twice as often. The warden re-arms ~9 s after any reopen.
drift_interval_ms = 2000
drift_guard = on
drift_correct_ms = 4

; ---- deep resync (NEW, v6.5.12) ---------------------------------------------
; Scheduled fresh reopen of the center leg every 30 minutes -- re-primes
; the S5's below-packetizer FIFO, the layer that can deepen silently over
; a movie while the drift ledger stays pinned. Brief center gap per event;
; warden re-arms ~9 s later. 0 = off.
deep_resync_min = 30

; ---- center presence --------------------------------------------------------
center_gate = on
center_upmix_guard = on

; NOTE: "priority = high" remains a dead key (pulled in v6.5.4); it is not
; present here.
}
