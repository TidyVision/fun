; twinspeak v8.0.0 config -- BIT-EXACT ASIO-strict engine: out1 = L/R + LFE fold,
; out2 = center ONLY (every other channel muted), no resampler anywhere.

; out1ms / out2ms set each leg's requested WASAPI device period. Keep them
; EQUAL -- equal periods keep the legs time-aligned. NOTE (v8.0.0): with
; both legs on the KS transport (below) these keys are IGNORED -- a KS
; leg's bite is ks_period_frames; out1ms/out2ms only matter if you opt a
; leg back into backendN = wasapi.
out1ms = 4
out2ms = 4

; CAPTURE burst period -- decoupled from the out periods above. Smaller =
; finer capture granularity = lower and more stable leg latency. In shared
; mode the Windows engine clamps this -- the banner prints the REAL
; negotiated burst (2 ms in the field).
cap_ms = 4

; Out RING depth per leg, in ms. The ring target is FLOORED at the FULL
; device buffer + a FULL capture burst + margin regardless of this -- the
; ring must survive the device's worst legitimate bite. At 4/4/cap4 on
; the KS transport the floor is ~8.3 ms (one 256-fr bite + burst + 1 ms
; margin); raise ring1_ms/ring2_ms only for extra glitch headroom (each
; ms costs 1 ms latency, legs stay aligned if kept equal).
; v6.3.1: a backend = ks leg floors LOWER -- one KS bite + one capture
; burst + 1 ms -- because its only pull is twinspeak's own pacing thread
; (exactly one bite, never merged).
ring1_ms = 4
ring2_ms = 4

; ALIGNMENT DELAY (v6.1): delay1_ms / delay2_ms push ONE leg's output
; later by whole milliseconds -- a BIT-EXACT ring delay: the leg's ring
; target grows, the samples leave it later, nothing is resampled or
; regenerated. Put the delay on whichever leg arrives EARLY:
;   * the center speaker's USB path (amp + DSP) lags the mains -> raise
;     delay1_ms so out1 waits for it;
;   * the center leg runs early instead -> raise delay2_ms.
; The banner prints each leg's 'est path' -- start at the printed
; difference between the two legs, then trim by ear in 1-2 ms steps.
; (The S5's own amp latency is OUTSIDE the printed path -- only the ear
; can see it.) Each ms costs 1 ms of latency on that leg only.
delay1_ms = 66
delay2_ms = 0

; v6.6.8: exclusive (WASAPI, both legs), capture_exclusive and
; align_modes are part of the engine now -- ALWAYS ON, no ini key.
; Both legs open WASAPI-exclusive together (a driver refusal reopens
; BOTH shared so device buffering stays identical) and the VAC capture
; pin is taken exclusive with a logged shared fallback. Exclusive
; bypasses the Windows volume slider -- that is what volume_follow
; exists for. (pin_outputs is part of the engine now -- ALWAYS ON.)

; Fold the cable's LFE onto FL/FR at gain_lfe -- the CONFIRMED routing
; ("LFE is mixed fully into the left and right channels"). The sub is
; not discrete; it lives inside the front channels. lfe_fold = off
; instead drives the DISCRETE 5.1 LFE channel (only for a real sub).
lfe_fold = on

; Substring match against device names (see: twinspeak --list)
input_device   = Line 1
output_device1 = Realtek
output_device2 = Xtream

; optional mixes (gain_lfe = LFE fold gain onto FL/FR; set 1.0 for a
;                    unity fold. With lfe_fold = off it scales the
;                    discrete sub.)
gain_l = 1.0
gain_r = 1.0
gain_lfe = 0.71
gain_center = 1.0

; CENTER DIALOGUE EQ (v6.5.18): an opt-in peaking boost on the center
; channel, applied ONLY to out2 (the center speaker). Built for exactly
; one job: lifting dialogue presence without touching the mains. It
; CANNOT be done with Equalizer APO -- the legs are kernel-streaming
; pins, and KS bypasses the Windows audio engine (and every APO) whole.
; center_eq = off keeps out2 bit-exact (the default). When on:
;   center_eq_freq -- the peak's center in Hz. Dialogue presence and
;     intelligibility live around 1.5-3 kHz; 1800 Hz is the general pick.
;   center_eq_gain -- boost in dB. +2..+4 subtle, +6 obvious; the path
;     clamps at full scale and gain_center stacks on top, so loud
;     center peaks may clip first -- lower gain_center if they do.
;   center_eq_q    -- sharpness. 0.7-1.0 = broad musical bump; 2+ = a
;     narrow spike (harsh faster).
center_eq = on
center_eq_freq = 237
center_eq_gain = 2.5
center_eq_q = 0.30
; v7.1.9 EQ SAVE SLOTS: five user slots replace the old built-in
; presets. Left-click a slot applies it AND arms it; adjust the
; sliders, press SAVE TO SLOT on the CENTER EQ page and the curve
; + the EQ pill land in the armed slot (right-click a slot saves
; straight into it) -- either way this file is spliced at once.
; Slot 1 ships reserved with the dialogue curve below; a freq of 0
; marks an empty slot.
eq_slot1_on = on
eq_slot1_freq = 237
eq_slot1_gain = 2.5
eq_slot1_q = 0.30
eq_slot2_on = off
eq_slot2_freq = 0
eq_slot2_gain = 0
eq_slot2_q = 0
eq_slot3_on = off
eq_slot3_freq = 0
eq_slot3_gain = 0
eq_slot3_q = 0
eq_slot4_on = off
eq_slot4_freq = 0
eq_slot4_gain = 0
eq_slot4_q = 0
eq_slot5_on = off
eq_slot5_freq = 0
eq_slot5_gain = 0
eq_slot5_q = 0

; VOLUME: volume_follow = the Windows volume of the cable's PLAYBACK
; side (the Line 1 slider in sndvol, or the volume hotkeys when Line 1
; is the default device) is the single master knob -- twinspeak
; multiplies every captured frame by it, so BOTH out1 and out2 track it
; identically. The playback endpoint is matched by name: volume_endpoint
; first (substring), then input_device, then any 'Virtual Audio Cable'
; render endpoint. If nothing matches, the banner prints EVERY render
; endpoint with its state -- copy the cable's playback name into
; volume_endpoint and rerun.
volume_follow = on
volume_endpoint =
; v7.0.0: pin_outputs is part of the engine now -- ALWAYS ON: both
; endpoint volumes are pinned 100% / unmuted while the engine runs,
; EXCEPT a leg whose device IS the current default playback device:
; that slider belongs to the user and is never written (v7.6.3).
out2_first = on

; KEEP-ALIVE (v7.1.7: BUILT IN -- no keys, no UI): out2 sums a sine on
; both channels every frame (silence or not) so the center device
; never sees digital silence. 40 Hz @ 0.5% (0.005, -46 dBFS) since
; v7.1.24 -- far below hearing, and a wobble every amp's sleep timer
; treats as signal. The watchdog reopens out2 automatically whenever
; it comes back.
; POST-MIX: the tone and the chime are summed in the out2 OUTPUT
; callbacks, after the mix -- they never enter the capture stream an
; OBS capture records.

; CHIMES (v6.2): the CenterFold startup signature is back, modernized.
; The old jingle was a rising SQUARE fifth (G5 784 Hz -> D6 1174.66 Hz);
; the modernized chime keeps the rising fifth but plays two short
; TRIANGLE BLIPS in the low treble instead: C7 2093 Hz (42 ms) -> G7
; 3136 Hz (72 ms), fast decay -- a blip, not a horn. It plays on the
; CENTER speaker the moment the engine goes live, and again whenever
; the watchdog brings out2 back (3 s cooldown). It is a UI cue, not
; program audio: summed at the out2 device layer exactly like the
; keep-alive, so volume_follow does NOT scale it, and out1 -- the
; bit-exact mains path -- NEVER carries it. chime_gain is the blip
; peak (0..1; 0.4 = clearly audible; lower it if the center speaker
; runs hot). chimes = off restores the v6.1 silence.
chimes = on
chime_gain = 0.1

; v6.6.8: background is part of the engine now -- ALWAYS ON. The
; console detaches after a successful start and everything logs to
; twinspeak.log next to this ini. Stop a background run with:
;   taskkill /IM twinspeak.exe
; Start it visible anyway with:   twinspeak --foreground

; v6.6.8: yield_default is part of the engine now -- ALWAYS ON: when
; the WINDOWS DEFAULT render endpoint is (or becomes) one of
; twinspeak's leg devices, that leg's DAC is released so the app
; playing to the default owns the hardware; the leg reopens by
; itself once the default moves elsewhere AND the device is QUIET
; (the log announces both directions -- 'legN YIELD').

; WDM-KS OUTPUT BACKEND (v6.3) -- the FlexASIO path, inside twinspeak.
; v8.0.0: BOTH LEGS RUN KS BY DEFAULT -- the kernel-level loop. The
; v7.9.0 field log (the 'switch served' meter) closed the case: even with
; MMCSS on every thread, miniaudio's event-driven device thread phase-
; locks to a 2-period stride at 100% CPU -- every service lands just past
; the DAC's stale boundary, and no priority can wake a thread before its
; event fires. KS pacing has no deadline to miss: the pacer writes the
; instant the DAC's own position register says the lead was consumed.
; NO UI CONTROL (as since v7.1.7) -- backendN = wasapi opts a leg back
; into miniaudio exclusive event mode (and is the automatic fallback if
; the driver refuses the pin). A KS leg is a direct render pin on the
; device's wave filter (KsCreatePin),
; the WaveRT looped buffer as the device's own DMA memory, and the
; hardware play-position register mapped read-only -- twinspeak's own
; TIME-CRITICAL thread paces the stream against the DAC itself, with no
; events, no engine and no scheduler intermediaries in between. The
; audio crossing the buffer switch is bit-identical (same rings, same
; replay/drop rules, same gates); only the transport changes.
;   backendN = ks      WDM-KS -- the DEFAULT (the kernel-level loop)
;   backendN = wasapi  wasapi exclusive (miniaudio event mode) -- the
;                      automatic fallback and the opt-out
; ks_period_frames = the buffer-switch size in SAMPLES (256 @ 48 kHz =
; one bite every 5.33 ms; 96 = one bite every 2 ms -- smaller bites
; shrink the KS ring floor too; v6.5.14 field note: 128 MINIMUM paces
; much steadier -- the lapse guard's lap window shrinks with the loop
; and sub-128 loops buzzed in the field). ks_periods = the looped buffer size
; around it: 2 = the write lead is one period (lowest latency, the pump
; must never miss a deadline), 3 = one extra period of grace
; (recommended), up to 8 -- a 1 in the ini clamps to 2 with a log line
; (a 1-period loop has no write lead at all). The DAC adds its hardware
; FIFO on top (~1-2 ms, printed). v6.3.1: with both legs on ks the
; banner's align line prints the est-path DIFFERENCE and which delay
; knob to move -- the delay trim starts from that number. v6.5.9: the
; health log's 'devbuf' line (every 10 s) prints the MEASURED version
; of those paths off the live devices (device pad + ring depth).
; KS bypasses the Windows endpoint: no endpoint volume there, so
; output pinning (always on, v7.0.0) is a no-op on a KS leg --
; volume_follow still governs it
; (applied in the pump, exactly as before). If the driver refuses the
; pin (no WaveRT support, format refused, pin busy) that leg logs the
; reason and falls back to WASAPI exclusive automatically. Use
;   twinspeak --list-ks
; to see every WDM-KS render filter with its pins and formats -- the
; SAME name needles as below match the KS filters.
backend1 = ks
backend2 = ks
ks_period_frames = 256
ks_periods = 3

; CLOCK SYNC (v6.0, ASIO-strict): the audio path is BIT-EXACT -- there
; is no resampler and no pitch control anywhere in twinspeak. Clock
; drift between the cable's virtual clock and each device crystal is
; absorbed by two device-master rules at the buffer switch:
;   * a buffer switch the ring cannot fill is an UNDERRUN: it is a
;     clean dropout (v7.8.4, built in): the leg goes
;     silent while the ring restarts from the freshest capture (see
;     the UNDERRUN RULE block below) -- never a replay tile.
;   * ring excess above the natural sawtooth (cable faster than device)
;     is dropped OLDEST-first, at most once per 5 s per leg, logged.
; The health line shows the measured offset ('off +N ppm'). At crystal
; level both events are minutes apart. If 'off' sits far from 0, the
; one-shot hint prints the value -- enable Clock Correction for the
; cable in the VAC Control Panel and trim it until 'off' reads ~0; a
; bit-exact path + a corrected cable clock = a silent path forever.
; v6.6.8: clock_sync is part of the engine now -- ALWAYS ON.

; DRIFT WARDEN (v6.4) -- the timestamp system. Every capture burst is
; stamped into a frame-interval ledger: each leg tracks the capture
; sequence number of its play boundary, advanced by exactly the real
; frames that cross it (pops, gated drops, warden skips; replays and
; deliberate pads never advance it). The difference of the two
; boundaries IS the measured delay between the two speakers, printed
; every second as 'drift' on the health line -- pure frame arithmetic,
; no clock involved, so it cannot lie. The drift column INCLUDES your
; own delay1_ms/delay2_ms: at delay1_ms = 60 it reads about -65 (the
; few-ms remainder is the legs' natural start asymmetry) -- that
; offset IS the alignment your ear asked for, not a fault. The 'err'
; column beside it is the distance from the calibrated baseline --
; the number the warden acts on; err ~ +0.0 means the path is pinned.
; For ~9 s after boot the warden
; CALIBRATES: it averages the settled drift into a baseline (your
; delay1_ms/delay2_ms calibration is inside that number). After that,
; a drift that leaves the baseline by >= drift_correct_ms (default 10)
; for 3 consecutive seconds is CORRECTED automatically (a RESYNC), at
; most once per drift_interval_ms (default 5000): the late leg's ring
; gives back its excess (a bit-exact
; skip -- the same operation as the clock rule above) and the early
; leg is held (its last buffer replays in place until the depth
; returns). No sample value is ever touched. Two honest limits:
;   * the ledger sees the HOST pipeline only -- anything below the USB
;     packetizer (the S5's own receiver FIFO / amp silicon) is
;     invisible. If the drift column stays flat while your ears hear
;     drift, the offset is device silicon and no host trigger exists --
;     the log then proves exactly that.
;   * a correction is a skip or a stutter of drift_correct_ms at most
;     (rate-limited): that is the price of re-pinning a bit-exact path.
; v6.6.8: drift_guard is part of the engine now -- ALWAYS ON (the
; ledger + the drift column were never optional anyway).
drift_correct_ms = 5

; drift_interval_ms (v6.5.8, default retuned in v6.5.10): minimum
; spacing between warden corrections (the RESYNC interval). Default
; 5000 = the five-second resync. Since v6.5.12 the clamp floor is
; 2000 (range 2000..60000), so a long session can chase drift on a
; 2 s clock. Between corrections the drift error can keep
; ramping, so latency-critical playback (rhythm games) wants this as
; tight as tolerable: each correction is a small audible skip of up
; to drift_correct_ms, so tighter spacing = more frequent, smaller
; corrections. Raise it only if the skips ever bother you. Also (in
; v6.5.8): any device reopen (sleep/wake, USB re-enumeration) now
; invalidates the drift baseline and re-arms it once the path settles
; (~9 s: 5 s settle + a 4-sample average) -- a boot-time-only
; baseline went stale against exactly those events.
drift_interval_ms = 2000

; UNDERRUN RULE (v7.8.4, built in -- no key, no switch): a buffer
; switch the out ring cannot fill never tiles the last buffer back.
; A DEEP shortfall (half the switch or more is hole) -- or a SUSTAINED
; run of shallow ones (7 of the last 16 switches short: the ring
; hovering just above empty under 100% CPU, which reads as a fine
; static-ey crackle) -- starts the ring OVER: silence while the pump
; rebuilds to the target anchor (your delay1_ms/delay2_ms depth
; included, so a delayed leg comes back with its calibration intact),
; then the silent gap is skipped oldest-first and playback resumes at
; the FRESHEST capture with the original latency. One clean dropout
; you notice, instead of a buzz you cannot un-hear. Restarts are
; logged ('drop corr') and counted in the devbuf line; a hold-off
; that lasts 3 s feeds the stall resync and reopens the leg.

; STALL RESYNC (v6.5.11, always on -- no ini key): if a leg's device
; thread starves (an interrupt storm, a 100% CPU hog) the leg falls
; behind while the pump kept feeding its ring (v7.8.3: a drop-correct
; hold-off counts as starvation evidence too). The health loop
; recovers both ways: stale backlog above the leg's anchor is
; discarded immediately (bit-exact skip, logged as 'stall resync'),
; and starvation lasting 3 consecutive seconds reopens the leg fresh
; -- which also resets whatever the device's own silicon accumulated
; during the storm.

; KS LAPSE GUARD (v6.5.13, always on): if the KS pacing thread is
; ever descheduled past one full WaveRT loop lap, the play
; register's residue silently loses laps and the DAC circles the
; loop re-reading stale audio -- a reverberated sawing mixed into
; the program, invisible to every other meter. The guard cross-
; checks the DAC's wall-exact advance against the register residue
; on every 500 us poll and re-pins the write cursor to play+lead on
; any loss (bit-exact skip, logged as 'KS lapse', counted in the
; devbuf line). KS legs also self-heal cleanly across suspend now.

; DEEP RESYNC (v6.5.12, optional): the S5's below-packetizer layer
; (endpoint FIFO + amp silicon) can deepen silently over a long
; session -- the drift ledger stays pinned while the center audibly
; lags again. No host meter can see that layer; a scheduled fresh
; reopen of the center leg re-primes it. Each resync is a brief
; center gap and the warden re-arms ~9 s later; your delay1_ms
; calibration holds across it. 0 = off (default); try 30 for long
; movie sessions.
deep_resync_min = 0

; POWER GUARD (v6.5.2) -- sleep / Modern-Standby survival. Field log
; (Lenovo M720Q): after sleep the S5's stream consumed ~42% of the
; cable's rate with a FRESH heartbeat -- the silence watchdog is blind
; to that, and the path glitched forever in a drop/re-pin limit cycle.
; With the guard ON: suspend parks the pumps; resume rebuilds the
; capture pin + both legs (and replays the startup chime); any leg
; whose measured clock offset ('off') leaves +-10% for 2 s is reopened
; fresh -- that catches the degraded sleep-ENTRY window too, which
; fires before the suspend broadcast. Every action is logged.
; v6.6.8: power_guard is part of the engine now -- ALWAYS ON.

; CENTER PRESENCE (v6.1) -- out2 plays the center channel ONLY while it
; is genuinely present. Two gates, both default ON:
;   center_gate -- a block whose ch3 is digital zero emits NOTHING but
;     the keep-alive tone: if the center channel is ever zero, every
;     channel of that sample stays zero. Never a substitute.
;   center_upmix_guard -- when the SOURCE has no center of its own (a
;     stereo app on the 8ch cable), the Windows engine fills FC with
;     a*FL + b*R at the cable's playback side -- BEFORE twinspeak can
;     capture it, so channel muting cannot remove it (this is the 'if
;     the center channel is absent it mixes left and right instead'
;     issue). The guard recognizes that exact fingerprint per block
;     (least-squares ch3 ~ a*ch1 + b*ch2, residual < -30 dB, gains in
;     the upmix band, fronts active) and mutes those blocks too -- the
;     center speaker stays on keep-alive only. Genuine 5.1 center is an
;     INDEPENDENT track and never matches; it always passes. The health
;     line counts guarded blocks ('cm') -- with real 5.1 content it
;     must read 0. v6.6.8: center_gate and center_upmix_guard are
;     part of the engine now -- ALWAYS ON.

; ROUTING GUARANTEE (zero duplication, by construction):
;   out1 gets ONLY ch1 (FL) and ch2 (FR) plus gain_lfe * ch4 (LFE)
;   folded onto both. The 5.1 stream's center, discrete sub and
;   surround channels are DRIVEN DIGITAL SILENCE, so no layer (Windows
;   engine, miniaudio converter, Speaker Fill) has any signal to
;   upmix into a fake center. out2 gets ONLY ch3 (center): every other
;   input channel is EXPLICITLY MUTED in the out2 path -- out2 is not
;   a clone of the program audio. The startup banner prints the route
;   map on every launch.
;
; NOTE: output2 always sums the keep-alive sine (BUILT IN, v7.1.24:
; 40 Hz @ 0.5%) onto both channels, every
; frame, so the center device NEVER sees digital silence -- and when
; the center gates mute a block, the keep-alive is ALL that block
; carries. The out2 pump also runs FIRST and at the higher priority
; (out2_first): the center leg gets the freshest data and the most
; scheduling attention; delay1_ms/delay2_ms then trim the alignment.

; v7.0.4: gui_theme = the control window's color theme (0..7), saved
; automatically whenever the THEME button cycles it. 0 = DARK CYAN,
; the classic. Delete the line to fall back to the default.
gui_theme = 0

; v7.1.2: startup_engine = when the startup launch (--tray, the
; sign-in path) starts TRAY-ONLY (v7.1.6: no window exists until
; you click the tray icon), the engine starts BY ITSELF -- no
; START press needed. off = the old behavior (the engine waits
; for START).
startup_engine = on

; v7.1.20: gui_window_x / gui_window_y = where the control panel
; last sat, rewritten automatically each time it hides (the values
; below land in the file on the next save). -99999 = let Windows
; place it; the position is always clamped back into a live
; monitor's work area on open.
gui_window_x = -99999
gui_window_y = -99999
