; twinspeak v8.5.0 config -- BIT-EXACT ASIO-strict engine: out1 = L/R + LFE fold,
; out2 = center ONLY, out3 = the rear pair ON ONE DEVICE + the v8.4.6 side
; folds (ch5 onto the left output, ch6 onto the right; optional; an EMPTY
; device keeps the rears silent), no resampler anywhere.
; v8.1.0 THE STRIPPED PATH: no out rings, no pumps, no capture-burst
; accounting -- the buffer switch pops the capture fan-out ring
; directly and mixes inline; the DAC's own position register paces
; every write (100 ns high-resolution timer poll, no busy wait).
; cap_ms / ring1_ms / ring2_ms are read-and-ignored.

; v8.2.0: out1ms / out2ms (and the legacy buffer_size alias) are
; read-and-ignored too -- the WASAPI device period is an engine
; constant now (1 ms, hardcoded; a KS leg ignores it whole).
; v8.3.0: volume_follow, drift_correct_ms, drift_interval_ms and
; deep_resync_min joined them -- hardcoded from the fielded ini
; (on / 5 / 5000 / 30). The knobs that are left: the delays + the
; rear offsets below, the KS bite, the gains, the EQ and the chime.
; v8.4.0: lfe_fold joined them too -- the fold is the confirmed
; routing, built in; gain_lfe below still scales it. v8.4.0 also
; adds THE REAR LEGS: output_device3, offset3_ms and gain_rl/gain_rr
; (an EMPTY rear device keeps the rears silent). v8.4.11: ONE rear
; device carries BOTH rears (the old output_device4/offset4_ms are
; read-and-ignored -- stale lines load clean).

; ALIGNMENT DELAY (v6.1): delay1_ms / delay2_ms push ONE leg's output
; later by whole milliseconds -- a BIT-EXACT ring delay: the leg's ring
; target grows, the samples leave it later, nothing is resampled or
; regenerated. Put the delay on whichever leg arrives EARLY:
;   * the center speaker's USB path (amp + DSP) lags the mains -> raise
;     delay1_ms so out1 waits for it;
;   * the center leg runs early instead -> raise delay2_ms.
; The banner prints each leg's 'est path' -- start at the printed
; difference between the two legs, then trim by ear in 1-2 ms steps.
; (The S5's own amp latency is OUTSIDE the printed path -- only the ear
; can see it.) Each ms costs 1 ms of latency on that leg only.
delay1_ms = 68
delay2_ms = 0
offset3_ms = 0

; v6.6.8: exclusive (WASAPI, both legs), capture_exclusive and
; align_modes are part of the engine now -- ALWAYS ON, no ini key.
; Both legs open WASAPI-exclusive together (a driver refusal reopens
; BOTH shared so device buffering stays identical) and the VAC capture
; pin is taken exclusive with a logged shared fallback. Exclusive
; bypasses the Windows volume slider -- that is what volume_follow
; exists for. (pin_outputs is part of the engine now -- ALWAYS ON.)

; Fold the cable's LFE onto FL/FR at gain_lfe -- the CONFIRMED routing
; ("LFE is mixed fully into the left and right channels"). The sub is
; not discrete; it lives inside the front channels. v8.4.0: the fold
; is BUILT IN -- always on, no key (a stale lfe_fold line in an old
; ini loads clean and is ignored); gain_lfe below still scales it.

; v8.4.1 THE CENTER FOLD: an EMPTY output_device2 (no center device)
; is LEGAL -- leg2 never opens, and the center channel (ch3) FOLDS
; onto leg1's FL/FR at gain_center, exactly the LFE fold's pattern:
; FL = gain_l*L + gain_lfe*LFE + gain_center*C, FR the mirror. The
; center upmix guard rides the fold too -- a stereo source's phantom
; FC (a*FL + b*FR, filled in by the Windows engine at the cable's
; playback side) is ZEROED out of the fronts immediately (v8.4.11:
; no fade -- the zeroing renders the moment the fingerprint is
; measured), so it can never double onto FL/FR; genuine 5.1 center
; always plays. A
; NON-empty output_device2 that matches no device is still a hard
; error. The center EQ is out2-only: with the fold active it does
; not apply (the fold is a plain gain_center sum).

; v8.4.0 THE REAR LEGS + v8.4.6 THE SIDE FOLD; v8.4.11 THE ONE REAR
; LEG: ONE stereo device carries the cable's rear pair -- ch7 (RL)
; and ch8 (RR) -- with the SIDES folded onto their same-side output:
; out L = gain_rl * (ch7 + ch5), out R = gain_rr * (ch8 + ch6) --
; the side (ch5 SL / ch6 SR, the slots a 5.1 movie's surround lands
; on) rides its same-side rear output at that side's gain, each
; lane gated BY ITSELF (see CENTER PRESENCE below); a 7.1 movie
; sums sides and backs on each rear output.
; offset3_ms stays the leg's bit-exact delay (offset4_ms is retired
; with the merge, read-and-ignored). An EMPTY device (as shipped
; below) keeps the rears SILENT -- no error, no output: empty in =
; empty out, the truth, and an empty leg3 takes its side fold down
; with it. out1's 5.1 side slots stay DRIVEN SILENCE, hardcoded --
; the sides never play out1, they ride the rears ONLY. A 5.1
; movie's surround now plays the rear speakers natively.

; Substring match against device names (see: twinspeak --list).
; v8.4.0: the rear leg -- output_device3 EMPTY (as shipped) keeps the
; rears silent; fill it when the rears get their own device (ONE
; device carries both -- v8.4.11).
; v8.4.1: output_device2 may stay EMPTY too -- the center then folds
; onto leg1's FL/FR at gain_center (see THE CENTER FOLD above).
input_device   = Virtual Cable 1
output_device1 = Realtek HD Audio output
output_device2 = Adesso Xtream S5
output_device3 = 

; optional mixes (gain_lfe = the LFE fold gain onto FL/FR; 1.0 = a
;                    unity fold; gain_rl/gain_rr scale the rear legs
;                    AND their v8.4.6 side folds; gain_center scales
;                    ch3 -- out2's mix, and the leg1 fold when
;                    output_device2 is EMPTY)
gain_l = 1
gain_r = 1
gain_rl = 1
gain_rr = 1
gain_sl = 1
gain_sr = 1
gain_lfe = 0.707
gain_center = 1

; CENTER DIALOGUE EQ (v6.5.18): an opt-in peaking boost on the center
; channel, applied ONLY to out2 (the center speaker). Built for exactly
; one job: lifting dialogue presence without touching the mains. It
; CANNOT be done with Equalizer APO -- the legs are kernel-streaming
; pins, and KS bypasses the Windows audio engine (and every APO) whole.
; center_eq = off keeps out2 bit-exact (the default). When on:
;   center_eq_freq -- the peak's center in Hz. Dialogue presence and
;     intelligibility live around 1.5-3 kHz (v8.4.27: the field pick is
;     287 Hz).
;   center_eq_gain -- boost in dB. +2..+4 subtle, +6 obvious; the path
;     clamps at full scale and gain_center stacks on top, so loud
;     center peaks may clip first -- lower gain_center if they do.
;   center_eq_q    -- sharpness. 0.7-1.0 = broad musical bump; 2+ = a
;     narrow spike (harsh faster).
center_eq = on
center_eq_freq = 237.154
center_eq_gain = 5.5
center_eq_q = 0.160694
; v7.1.9 EQ SAVE SLOTS: five user slots replace the old built-in
; presets. Left-click a slot applies it AND arms it; adjust the
; sliders, press SAVE TO SLOT on the CENTER EQ page and the curve
; + the EQ pill land in the armed slot (right-click a slot saves
; straight into it) -- either way this file is spliced at once.
; Slot 1 ships reserved with the dialogue curve below; a freq of 0
; marks an empty slot.
eq_slot1_on = on
eq_slot1_freq = 387
eq_slot1_gain = 3.5
eq_slot1_q = 0.3
eq_slot2_on = on
eq_slot2_freq = 237.154
eq_slot2_gain = 5.5
eq_slot2_q = 0.160694
eq_slot3_on = off
eq_slot3_freq = 0
eq_slot3_gain = 0
eq_slot3_q = 0
eq_slot4_on = off
eq_slot4_freq = 0
eq_slot4_gain = 0
eq_slot4_q = 0
eq_slot5_on = on
eq_slot5_freq = 3296.32
eq_slot5_gain = 3.5
eq_slot5_q = 0.160694

; VOLUME (v8.3.0: volume_follow is BUILT IN, hardcoded on): the
; Windows volume of the cable's PLAYBACK side (the Line 1 slider in
; sndvol, or the volume hotkeys when Line 1 is the default device) is
; the single master knob -- twinspeak multiplies every captured frame
; by it, so EVERY leg tracks it identically (v8.4.0: all four). The
; endpoint is matched by name: volume_endpoint first (substring),
; then input_device, then any 'Virtual Audio Cable' render endpoint.
; If nothing matches, the banner prints EVERY render endpoint with its
; state -- copy the cable's playback name into volume_endpoint and
; rerun.
volume_endpoint = 
; v7.0.0: pin_outputs is part of the engine now -- ALWAYS ON: both
; endpoint volumes are pinned 100% / unmuted while the engine runs,
; EXCEPT a leg whose device IS the current default playback device:
; that slider belongs to the user and is never written (v7.6.3).
out2_first = on

; KEEP-ALIVE (v7.1.7: BUILT IN -- no keys, no UI; v8.4.5: UNIVERSAL):
; EVERY output leg sums a sine on its driven slots every frame
; (gated or not, silence or not) so no device ever sees digital
; silence -- 20 Hz @ 0.1% (0.001, -60 dBFS) since v8.4.5 (was 40 Hz
; @ 0.5% since v7.1.24): far below hearing, and a wobble every
; amp's sleep timer treats as signal. A gated block (any lane:
; ch3/ch7/ch8 all-zero, or the v8.4.6 side lanes ch5/ch6) is
; PROGRAM silence -- the wobble rides on, the amp stays fed. The
; watchdog reopens a failed leg automatically
; whenever it comes back.
; POST-MIX: the tone (and out2's chime) are summed in the OUTPUT
; callbacks, after the mix -- they never enter the capture stream
; an OBS capture records.

; CHIMES (v6.2): the CenterFold startup signature is back, modernized.
; The old jingle was a rising SQUARE fifth (G5 784 Hz -> D6 1174.66 Hz);
; the modernized chime keeps the rising fifth but plays two short
; TRIANGLE BLIPS in the low treble instead: C7 2093 Hz (42 ms) -> G7
; 3136 Hz (72 ms), fast decay -- a blip, not a horn. It plays on the
; CENTER speaker the moment the engine goes live, and again whenever
; the watchdog brings out2 back (3 s cooldown). It is a UI cue, not
; program audio: summed at the out2 device layer exactly like the
; keep-alive, so volume_follow does NOT scale it -- and the chime is
; out2-ONLY (out1 carries just the universal wobble, never the
; chime). chime_gain is the blip
; peak (0..1; 0.4 = clearly audible; lower it if the center speaker
; runs hot). chimes = off restores the v6.1 silence.
chimes = on
chime_gain = 0.4

; v6.6.8: background is part of the engine now -- ALWAYS ON. The
; console detaches after a successful start and everything logs to
; twinspeak.log next to this ini. Stop a background run with:
;   taskkill /IM twinspeak.exe
; Start it visible anyway with:   twinspeak --foreground

; v6.6.8: yield_default is part of the engine now -- ALWAYS ON: when
; the WINDOWS DEFAULT render endpoint is (or becomes) one of
; twinspeak's leg devices, that leg's DAC is released so the app
; playing to the default owns the hardware; the leg reopens by
; itself once the default moves elsewhere AND the device is QUIET
; (the log announces both directions -- 'legN YIELD').

; WDM-KS OUTPUT BACKEND (v6.3) -- the FlexASIO path, inside twinspeak.
; v8.0.0: BOTH LEGS RUN KS BY DEFAULT -- the kernel-level loop. The
; v7.9.0 field log (the 'switch served' meter) closed the case: even
; with MMCSS on every thread, miniaudio's event-driven device thread
; phase-locks to a 2-period stride at 100% CPU -- every service lands
; just past the DAC's stale boundary, and no priority can wake a
; thread before its event fires. KS pacing has no deadline to miss:
; the pacer writes the instant the DAC's own position register says
; the lead was consumed. v7.1.7: NO UI CONTROL -- backendN = wasapi
; opts a leg back into miniaudio exclusive event mode. A KS leg is a
; direct render pin on the device's wave filter (KsCreatePin),
; the WaveRT looped buffer as the device's own DMA memory, and the
; hardware play-position register mapped read-only -- twinspeak's own
; TIME-CRITICAL thread paces the stream against the DAC itself, with no
; events, no engine and no scheduler intermediaries in between. The
; audio crossing the buffer switch is bit-identical (same rings, same
; replay/drop rules, same gates); only the transport changes.
;   backendN = ks      WDM-KS -- the DEFAULT (the kernel-level loop)
;   backendN = wasapi  wasapi exclusive (miniaudio event mode) -- the
;                      automatic fallback and the opt-out
; v8.4.11 THE 384x3 BITE (field-directed: "I want it so it's 384
; samples with 3 buffers instead"): ks_period_frames / ks_periods
; are BUILT IN -- 384 frames (8.0 ms of service, ~125 writes/s) x
; 3 periods (a 1152-fr / 24.0 ms WaveRT loop, a 16.0 ms write
; lead -- the deepest shipped lead yet). Fewer, larger writes
; than v8.4.9's 288 x 2, and a late service has twice the margin
; before the DAC grazes the buffer edge. No keys, no rows; stale
; ks_period_frames / ks_periods lines load clean and are ignored.
; The DAC adds its hardware FIFO on top
; (~1-2 ms, printed). v6.3.1: with both legs on ks the
; banner's align line prints the est-path DIFFERENCE and which delay
; knob to move -- the delay trim starts from that number. v6.5.9: the
; health log's 'devbuf' line (every 10 s) prints the MEASURED version
; of those paths off the live devices (device pad + ring depth).
; KS bypasses the Windows endpoint: no endpoint volume there, so
; output pinning (always on, v7.0.0) is a no-op on a KS leg --
; volume_follow still governs it
; (applied in the buffer switch, exactly as before). If the driver refuses the
; pin (no WaveRT support, format refused, pin busy) that leg logs the
; reason and falls back to WASAPI exclusive automatically. Use
;   twinspeak --list-ks
; to see every WDM-KS render filter with its pins and formats -- the
; SAME name needles as below match the KS filters.
backend1 = ks
backend2 = ks

; CLOCK SYNC (v6.0, ASIO-strict): the audio path is BIT-EXACT -- there
; is no resampler and no pitch control anywhere in twinspeak. Clock
; drift between the cable's virtual clock and each device crystal is
; absorbed by two device-master rules at the buffer switch:
;   * a buffer switch the ring cannot fill is an UNDERRUN: it is a
;     clean dropout (v7.8.4, built in): the leg goes
;     silent while the ring restarts from the freshest capture (see
;     the UNDERRUN RULE block below) -- never a replay tile.
;   * ring excess above the natural sawtooth (cable faster than device)
;     is dropped OLDEST-first, at most once per 5 s per leg, logged.
; The health line shows the measured offset ('off +N ppm'). At crystal
; level both events are minutes apart. If 'off' sits far from 0, the
; one-shot hint prints the value -- enable Clock Correction for the
; cable in the VAC Control Panel and trim it until 'off' reads ~0; a
; bit-exact path + a corrected cable clock = a silent path forever.
; v6.6.8: clock_sync is part of the engine now -- ALWAYS ON.

; DRIFT WARDEN (v6.4) -- the timestamp system. Every capture burst is
; stamped into a frame-interval ledger: each leg tracks the capture
; sequence number of its play boundary, advanced by exactly the real
; frames that cross it (pops, gated drops, warden skips; replays and
; deliberate pads never advance it). The difference of the two
; boundaries IS the measured delay between the two speakers, printed
; every second as 'drift' on the health line -- pure frame arithmetic,
; no clock involved, so it cannot lie. The drift column INCLUDES your
; own delay1_ms/delay2_ms: at delay1_ms = 60 it reads about -65 (the
; few-ms remainder is the legs' natural start asymmetry) -- that
; offset IS the alignment your ear asked for, not a fault. The 'err'
; column beside it is the distance from the calibrated baseline --
; the number the warden acts on; err ~ +0.0 means the path is pinned.
; For ~9 s after boot the warden
; CALIBRATES: it averages the settled drift into a baseline (your
; delay1_ms/delay2_ms calibration is inside that number). v8.1.0: the
; warden is OBSERVE ONLY -- a drift that leaves the baseline by
; >= 5 ms (v8.3.0: hardcoded, was drift_correct_ms) for 3 consecutive
; seconds LOGS an OBSERVE line (at most once per 5 s -- hardcoded,
; was drift_interval_ms) naming the drift and advising a delay trim
; BY EAR. No skip, no pad, no hold exists; the stripped path plays
; what capture delivers. Two honest limits:
;   * the ledger sees the HOST pipeline only -- anything below the USB
;     packetizer (the S5's own receiver FIFO / amp silicon) is
;     invisible. If the drift column stays flat while your ears hear
;     drift, the offset is device silicon and no host trigger exists --
;     the log then proves exactly that.
; v6.6.8: drift_guard is part of the engine now -- ALWAYS ON (the
; ledger + the drift column were never optional anyway).
; v8.3.0: drift_correct_ms is RETIRED with the key -- hardcoded
; 5 ms (the OBSERVE band), from the fielded ini.

; v8.3.0: drift_interval_ms is RETIRED with the key -- hardcoded
; 5000 ms, the OBSERVE line's spacing, from the fielded ini. Also
; (in v6.5.8): any device reopen (sleep/wake, USB re-enumeration) now
; invalidates the drift baseline and re-arms it once the path settles
; (~9 s: 5 s settle + a 4-sample average) -- a boot-time-only
; baseline went stale against exactly those events.
; v8.4.7 SLOW SYNC -> v8.4.20 THE REFERENCE IS LEG1: the mains are
; an existing hardware device with a real crystal -- out2/out3 sync
; their UNDELAYED boundaries to it (each leg subtracts its own
; delay, v8.4.15), and LEG1's own ring depth is guarded at its
; device-buffer anchor. A leg 5 ms late drops 240 frames (the
; warden bite), a leg 5 ms early pads 240 held frames across
; consecutive switches (the pad budget), at most one bite per 2 s.
; The 16-frame nudge (v8.4.9) is retired: it chased the two rings'
; capture-burst phase jitter ten skips a second (the center
; crackle). creep is CORRECTED, never accepted, no baseline, and
; no re-latch exists. No key, no UI row.

; UNDERRUN RULE (v8.1.0, built in -- no key, no switch): a buffer
; switch the raw ring cannot fully fill plays SILENCE for the hole
; and counts it in the health line's 'short' column -- never a
; repeated frame, never a replay tile, never a restart (v8.4.7: the
; slow sync's one-frame pad is not a hole-filler -- it is a held
; sample, rate-limited, holding the leg to out1): seams are gone by
; construction, and what remains is the honest hole. 3 s of
; sustained starvation (short switches every second) reopens the
; leg fresh -- which also resets the device's own silicon. Capture
; excess beyond the raw cap evicts the OLDEST frames (counted in
; 'evict'), so the path can only ever run late -- never torn.

; STALL RESYNC (v6.5.11, always on -- no ini key): if a leg starves
; (an interrupt storm, a 100% CPU hog) the shortfall rule counts it
; ('short' climbs every second). Starvation lasting 3 consecutive
; seconds reopens the leg fresh -- which also resets whatever the
; device's own silicon accumulated during the storm. v8.4.10: every
; reopen first discards the raw ring's backlog -- the leg resumes at
; the freshest capture (see DEEP RESYNC).

; KS LAPSE GUARD (v6.5.13, always on): if the KS pacing thread is
; ever descheduled past one full WaveRT loop lap, the play
; register's residue silently loses laps and the DAC circles the
; loop re-reading stale audio -- a reverberated sawing mixed into
; the program, invisible to every other meter. The guard cross-
; checks the DAC's wall-exact advance against the register residue
; on every 500 us poll and re-pins the write cursor to play+lead on
; any loss (bit-exact skip, logged as 'KS lapse', counted in the
; devbuf line). KS legs also self-heal cleanly across suspend now.
; v7.9.0: the KS pacer busy-waits on the DAC's position register
; through the last period + 0.5 ms of slack (at the default switch
; size that is the whole inter-switch window) -- one core per KS leg
; is the price of a deadline the scheduler cannot move.

; DEEP RESYNC (v6.5.12, optional): the S5's below-packetizer layer
; (endpoint FIFO + amp silicon) can deepen silently over a long
; session -- the drift ledger stays pinned while the center audibly
; lags again. No host meter can see that layer; a scheduled fresh
; reopen of the center leg re-primes it. Each resync is a brief
; center gap and the warden re-arms ~9 s later; your delay1_ms
; calibration holds across it. v8.3.0: hardcoded -- 30 min, the
; long-movie setting (was deep_resync_min). v8.4.10: every reopen
; first discards the raw ring's backlog -- while the leg was down
; the ring filled to cap and eviction pinned its read position
; ~170 ms behind the freshest capture, and a leg resumed from
; there played a permanent delayed copy of the stream (the
; loopback-sounding echo only a reset cleared). The leg now
; resumes at the freshest capture, its delay calibration intact.

; POWER GUARD (v6.5.2) -- sleep / Modern-Standby survival. Field log
; (Lenovo M720Q): after sleep the S5's stream consumed ~42% of the
; cable's rate with a FRESH heartbeat -- the silence watchdog is blind
; to that, and the path glitched forever in a drop/re-pin limit cycle.
; With the guard ON: suspend parks the legs; resume rebuilds the
; capture pin + both legs (and replays the startup chime); any leg
; whose measured clock offset ('off') leaves +-10% for 2 s is reopened
; fresh -- that catches the degraded sleep-ENTRY window too, which
; fires before the suspend broadcast. Every action is logged.
; v6.6.8: power_guard is part of the engine now -- ALWAYS ON.

; CENTER PRESENCE (v6.1) -- RETIRED v8.4.23: the mask-copy-mask fan-out
;     isolates ch3 for out2 alone (the first mask), the output is stereo
;     L+R only (the second mask), and the upmix kill switch disables the
;     cable endpoint's enhancements at the source -- there is no presence
;     state left to gate and no fingerprint to run. The 'center_gate' and
;     'center_upmix_guard' behaviors are gone with the machinery that
;     mistook complex game noise for silence.

; ROUTING GUARANTEE (zero duplication, by construction):
;   out1 gets ch1 (FL) and ch2 (FR) plus gain_lfe * ch4 (LFE) folded
;   onto both. FC, the discrete LFE slot AND the 5.1 side slots stay
;   DRIVEN DIGITAL SILENCE (the sides ride the rears only, v8.4.6),
;   so no layer (Windows engine, miniaudio
;   converter, Speaker Fill) has any signal to upmix into a fake
;   center -- the center belongs to out2 alone (v8.4.1: an EMPTY
;   output_device2 folds it onto out1's FL/FR at gain_center
;   instead), the rears AND the sides to out3 alone. out2 gets
;   ONLY ch3 (center): every other input
;   channel is EXPLICITLY MUTED in the out2 path -- out2 is not a
;   clone of the program audio. out3's LEFT output gets ch7 (rear
;   L) + ch5 (side L, the v8.4.6 fold) and its RIGHT output gets
;   ch8 (rear R) + ch6 (side R), at gain_rl/gain_rr, every lane
;   gated BY ITSELF (an all-zero lane mutes its own term; the mix
;   skips only when all four of the leg's lanes are zero); an
;   unconfigured rear leg is silent, never an error. The startup banner prints the route map on every launch.
;
; NOTE: EVERY output sums the keep-alive sine (BUILT IN, v8.4.5:
; 20 Hz @ 0.1%) on its driven slots, every frame, so no device EVER
; sees digital silence -- and when a lane gate mutes a block, the
; keep-alive is all that block carries. The out2 pump also runs
; FIRST and at the higher priority (out2_first): the center leg gets
; the freshest data and the most scheduling attention;
; delay1_ms/delay2_ms then trim the alignment. v8.4.1: with out2
; EMPTY the fold rides the always-driven mains -- which carry the
; wobble themselves now (v8.4.5).

; v7.0.4: gui_theme = the control window's color theme (0..7), saved
; automatically whenever the THEME button cycles it. 0 = DARK CYAN,
; the classic. Delete the line to fall back to the default.
gui_theme = 8

; v7.1.2: startup_engine = when the startup launch (--tray, the
; sign-in path) starts TRAY-ONLY (v7.1.6: no window exists until
; you click the tray icon), the engine starts BY ITSELF -- no
; START press needed. off = the old behavior (the engine waits
; for START).
startup_engine = on

; v7.1.20: gui_window_x / gui_window_y = where the control panel
; last sat, rewritten automatically each time it hides (the values
; below land in the file on the next save). -99999 = let Windows
; place it; the position is always clamped back into a live
; monitor's work area on open.
gui_window_x = 26
gui_window_y = 26
