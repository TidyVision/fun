; twinspeak v6.5.9 LOW-LATENCY PASS -- "push further on the latency spectrum"
; Built from your live ini. Three levers pulled, everything else untouched:
;
;   1. backend1/backend2 = ks            the WDM-KS direct-pin transport on
;                                        BOTH legs (equal transports stay
;                                        equal). At ks_period_frames = 64
;                                        the host path drops from ~19 ms
;                                        (WASAPI excl: ring 10 + dev 6 +
;                                        burst 3) to roughly ~8 ms.
;   2. cap_ms = 2                        the burst rides on every ring
;                                        floor; every ms here is a ms on
;                                        both legs.
;   3. delay1_ms = 68 -> RETRIM          see the DELAY RECALIBRATION block
;                                        below -- the biggest single number
;                                        left in your path.
;
; AFTER STARTING: read the banner's align line (est) and the health log's
; 'devbuf' line every 10 s (MEASURED: device pad + ring + burst per leg,
; and the measured diff). If a KS pin is refused (Realtek or the S5 USB
; filter), that leg logs the reason and falls back to WASAPI exclusive
; automatically -- nothing breaks, the path just sits ~8 ms higher. Check
; the banner to see which transport each leg actually got.

; ---- out periods (WASAPI fallback only; KS ignores these) ------------------
; 2 ms exclusive is still honored by most drivers; if one refuses, the
; banner says so -- set that leg back to 3. Keep EQUAL.
out1ms = 2
out2ms = 2

; ---- capture burst ----------------------------------------------------------
; 2 ms bursts on the exclusive WaveRT pin. If the banner shows the shared
; clamp (10 ms) instead, the VAC port driver fell back to WaveCyclic --
; switch it back to WaveRT in the VAC Control Panel. Aggressive option:
; cap_ms = 1 shaves one more ms off both legs (finer wakeups, trivial CPU).
cap_ms = 2

; capture pin: exclusive direct WaveRT path (unchanged)
capture_exclusive = on

; ---- ring depth -------------------------------------------------------------
; Left at 2 -- the FLOOR governs now: one KS bite (1.33 ms) + burst (2 ms)
; + 1 ms KS margin = ~4.3 ms per leg, far below the old WASAPI 10 ms floor.
; Legs stay aligned if kept equal.
ring1_ms = 2
ring2_ms = 2

; ---- DELAY RECALIBRATION (do this after the transport switch) ---------------
; delay1_ms = 68 was calibrated on the OLD, fatter buffers. If any of it was
; compensating host-side skew (instead of the S5's own silicon), the smaller
; buffers just removed that skew and 68 is now TOO BIG -- pure wasted
; latency, ms for ms. Procedure:
;   1. Run this config, open twinspeak.log, find a 'devbuf' line.
;   2. Note the measured path diff. It should still read near 0 with your
;      delay included (the warden pins to whatever you calibrate).
;   3. Trim delay1_ms DOWNWARD in 2 ms steps (68 -> 66 -> 64 ...). After
;      each step, restart and play the rhythm game. The moment the CENTER
;      starts arriving EARLY (you over-trimmed), go back up one step.
;   4. Every ms you remove is one ms off the TOTAL path -- this is where
;      the real milliseconds live now.
; If 68 survives all the way down unchanged, then it is genuinely S5
; silicon (its own receiver FIFO + amp DSP) and devbuf will have proven it:
; host paths equal, silicon lag = the number your ear asked for.
delay1_ms = 54
delay2_ms = 0

; ---- share mode (WASAPI fallback paths; unchanged) --------------------------
exclusive = on
align_modes = on

; ---- routing (unchanged) ----------------------------------------------------
lfe_fold = on

; ---- devices (unchanged) ----------------------------------------------------
input_device   = Line 1
output_device1 = Realtek
output_device2 = Adesso

; ---- mixes (unchanged) ------------------------------------------------------
gain_l = 1.0
gain_r = 1.0
gain_lfe = 0.809
gain_center = 1.0

; ---- volume (unchanged) -----------------------------------------------------
; NOTE on KS legs: no endpoint volume exists there, so pin_outputs is a
; no-op -- volume_follow still governs both legs from the pump side.
volume_follow = on
volume_endpoint =
pin_outputs = on
out2_first = on

; ---- keep-alive (unchanged) -------------------------------------------------
; 0.001 is below the documented S5 detect threshold -- if the center ever
; powers down while twinspeak runs, raise to 0.03..0.05 (still inaudible).
keepalive_hz = 100
keepalive_gain = 0.001

; ---- chimes (unchanged) -----------------------------------------------------
chimes = on
chime_gain = 0.3

; ---- background (unchanged) -------------------------------------------------
background = on

; ---- WDM-KS TRANSPORT (the latency lever) -----------------------------------
; 64-frame bites = one switch every 1.33 ms. ks_periods = 2: the write lead
; is exactly one period -- the lowest-latency loop (your old "1" clamps to
; 2 with a log line anyway; now it says so honestly). The pumps feed at
; 500 us (v6.5.7), so a 2-period loop has plenty of refill margin. If the
; pacing ever feels fragile on your machine (rare 1-period underruns under
; load), step ks_periods to 3 -- that buys one period of grace for +1.33 ms.
; The DAC's own hardware FIFO (~1-2 ms) sits on top and is printed in the
; banner / devbuf line.
backend1 = ks
backend2 = ks
ks_period_frames = 64
ks_periods = 2

; ---- clock sync (unchanged) -------------------------------------------------
clock_sync = on

; ---- drift warden (unchanged) ----------------------------------------------
; drift_interval_ms (v6.5.8) left at its 30000 default; drop it to 10000 for
; long rhythm-game sessions so corrections chase ramping drift tighter.
drift_interval_ms = 1000
drift_guard = on
drift_correct_ms = 2

; ---- center presence (unchanged) --------------------------------------------
center_gate = on
center_upmix_guard = on

; NOTE: your old ini's "priority = high" was silently ignored -- the CPU
; placement layer (priority + cpu_affinity) was pulled in v6.5.4 after
; field-testing proved the pin caused glitches. It is left out here
; entirely; scheduling is the scheduler's full inventory again.
